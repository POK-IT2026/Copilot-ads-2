# PlayOut Kids · Media Suite · Override SANDBOX
# Se usa con: docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
# El base (docker-compose.yml) es upstream de Raúl · no lo modificamos.
# Este override reemplaza el puerto host del base (3000→3005) para no chocar con prod.

services:
  app:
    container_name: campaign-copilot-sandbox
    # !override es Docker Compose 2.24+ · REEMPLAZA el array de ports del base
    # (que trae "3000:3000") en vez de agregarlo. Distinto de !reset que solo
    # borra la key sin definir la nueva.
    ports: !override
      - "127.0.0.1:3005:3000"
    # 15-sep-2026 · era `on-failure:3`, pensado para que un bug de la aplicación
    # no quedara escondido detrás de reinicios automáticos. El argumento sigue
    # siendo válido para caídas del proceso, pero NO contemplaba el reinicio de
    # la máquina: Docker solo levanta al arrancar los contenedores marcados
    # `always` o `unless-stopped`. Con `on-failure`, un reboot del VPS dejaba
    # sandbox caído hasta que alguien lo notara.
    #
    # `unless-stopped` respeta la parada manual: si lo bajas con `docker stop`
    # o `compose down`, no vuelve solo. Solo cubre el arranque del servidor.
    restart: unless-stopped
